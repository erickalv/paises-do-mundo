name: App Android (APK)

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk paises-do-mundo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: paises-do-mundo-apk
          path: paises-do-mundo.apk
      - name: Publicar no release "apk"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk paises-do-mundo.apk --title "App Android (build ${{ github.run_number }})" --notes "Baixe paises-do-mundo.apk e instale no Android." --latest
